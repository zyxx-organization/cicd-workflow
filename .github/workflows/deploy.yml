name: Universal Deploy
on:
  workflow_call:
    inputs:
      runner_label:
        description: 'Additional label of the existing self-hosted deployment runner'
        required: false
        default: 'raspi'
        type: string
      project_name:
        required: true
        type: string
      service_name:
        required: true
        type: string
      project_path:
        type: string
        default: ""
      branch:
        type: string
        default: main
      revision:
        description: Exact checked commit; empty preserves legacy branch deployment.
        type: string
        default: ""
      deploy_command:
        type: string
        default: ""
      rollback_command:
        description: Restore old code without replacing application data.
        type: string
        default: ""
      smoke_command:
        description: Read-only post-deployment checks.
        type: string
        default: ""
      healthcheck_url:
        type: string
        default: ""
jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    concurrency:
      group: deploy-${{ inputs.project_name }}
      cancel-in-progress: false
    steps:
      - name: Deploy checked revision
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_PATH: ${{ inputs.project_path }}
          BRANCH: ${{ inputs.branch }}
          REVISION: ${{ inputs.revision }}
          SERVICE_NAME: ${{ inputs.service_name }}
          DEPLOY_COMMAND: ${{ inputs.deploy_command }}
          ROLLBACK_COMMAND: ${{ inputs.rollback_command }}
          SMOKE_COMMAND: ${{ inputs.smoke_command }}
          HEALTHCHECK_URL: ${{ inputs.healthcheck_url }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${PROJECT_PATH:-/home/zyxx/projects/$PROJECT_NAME}"
          cd "$PROJECT_DIR"
          previous=$(git rev-parse HEAD)
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Refusing deployment over tracked local changes."
            exit 1
          fi
          git fetch origin "$BRANCH"
          target="${REVISION:-origin/$BRANCH}"
          if [ -n "$REVISION" ] && ! [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "An exact 40-character commit is required."
            exit 1
          fi
          target=$(git rev-parse --verify "$target^{commit}")
          git merge-base --is-ancestor "$target" "origin/$BRANCH"
          export DEPLOY_EXPECTED_SHA="$target"
          health() {
            [ -z "$HEALTHCHECK_URL" ] && return 0
            for attempt in 1 2 3 4 5; do
              if curl --max-time 5 -fsS "$HEALTHCHECK_URL" > /dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }
          rollback() {
            result=$?
            trap - ERR
            if [ -n "$ROLLBACK_COMMAND" ]; then
              echo "Release failed; restoring previous code $previous."
              if git checkout --detach "$previous" &&
                 bash -euo pipefail -c "$ROLLBACK_COMMAND" && health; then
                echo "Previous service restored. Application data was not rolled back."
              else
                echo "Rollback failed; operator attention required."
              fi
            fi
            exit "$result"
          }
          trap rollback ERR
          git checkout --detach "$target"
          echo "Deploying checked commit $target to $SERVICE_NAME."
          if [ -n "$DEPLOY_COMMAND" ]; then
            bash -euo pipefail -c "$DEPLOY_COMMAND"
          else
            sudo systemctl restart "$SERVICE_NAME"
          fi
          health
          if [ -n "$SMOKE_COMMAND" ]; then bash -euo pipefail -c "$SMOKE_COMMAND"; fi
          trap - ERR
          echo "Release verified: $target."
